@if (this.meeting(); as meeting) {
  @if (this.session(); as session) {
    <section class="flex flex-col gap-2">
      <p>{{ meeting.meeting_official_name }}</p>
      <div class="flex flex-col content-center gap-4 rounded-lg p-4 bg-base-200">
        <div>
          <p>{{ session.session_name }} at {{ session.circuit_short_name }}</p>
        </div>
        @if (this.circuitData(); as circuitData) {
          @if (!this.loading()) {
            <app-race-playback [circuitData]="circuitData"/>
          }
        }
      </div>
    </section>
  }
}
